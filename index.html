<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e0f11">
<title>Pitcherest — 一場比稿，一個共同大腦</title>
<meta name="description" content="Pitcherest 產品概念示範：把比稿過程中散落各處的資料，變成所有人都能查、都能用的 Project Brain。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e0f11'/%3E%3Cpath d='M11 23V9h6a4.5 4.5 0 010 9h-6' fill='none' stroke='%239cc2ae' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-tab="archive">
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="wordmark">Pitcherest</span>
      <span class="sep" aria-hidden="true"></span>
      <div class="switcher">
        <button class="switch-btn" id="projectBtn" aria-haspopup="true" aria-expanded="false">
          <span class="switch-name" id="projectName"></span>
          <svg class="ico" viewBox="0 0 16 16"><path d="M4 6.5l4 4 4-4"/></svg>
        </button>
        <div class="popover project-pop" id="projectPop" hidden></div>
      </div>
    </div>
    <div class="topbar-right"><span class="demo-flag">示範版本</span></div>
  </header>

  <main class="panes">
    <!-- ARCHIVE -->
    <section class="pane pane-archive" id="paneArchive" aria-label="資料庫">
      <div class="pane-head">
        <h2><span class="en">ARCHIVE</span><span class="zh">資料庫</span></h2>
        <div class="head-actions">
          <span class="count" id="archiveCount"></span>
          <button class="btn-quiet" id="uploadBtn" title="上傳檔案，系統會自動分類">
            <svg class="ico" viewBox="0 0 16 16"><path d="M8 11V3M5 6l3-3 3 3M3 13h10"/></svg><span>上傳</span>
          </button>
        </div>
      </div>
      <div class="archive-tools">
        <label class="search">
          <svg class="ico" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.25"/><path d="M10.5 10.5L14 14"/></svg>
          <input id="searchInput" type="search" placeholder="搜尋標題或內容" autocomplete="off">
        </label>
        <div class="filters" id="filters"></div>
        <div class="quick" id="quick"></div>
      </div>
      <div class="list-scroll" id="listScroll">
        <ul class="items" id="items"></ul>
        <div class="dropzone" id="dropzone">
          <p>把檔案拖曳到這裡，或按「上傳」試試看。</p>
          <p class="faint">系統會自動判斷類型、部門與主題。</p>
        </div>
      </div>
      <div class="selbar" id="selbar" hidden>
        <span id="selCount"></span>
        <span class="selbar-actions">
          <button class="link" id="selClear">清除</button>
          <button class="btn-solid go-view" id="goView">檢視</button>
        </span>
      </div>
    </section>

    <!-- ASK -->
    <section class="pane pane-ask" id="paneAsk" aria-label="提問">
      <div class="pane-head">
        <h2><span class="en">ASK</span><span class="zh">提問</span></h2>
        <div class="head-actions"><button class="btn-quiet" id="chatReset" hidden>重新開始</button></div>
      </div>
      <div class="chat-scroll" id="chatScroll">
        <div class="chat" id="chat"></div>
      </div>
      <form class="composer" id="composer" autocomplete="off">
        <input id="askInput" type="text" placeholder="向整個資料庫提問，例如：目標消費者是誰？" aria-label="輸入問題">
        <button type="submit" class="send" aria-label="送出問題"><svg class="ico" viewBox="0 0 16 16"><path d="M8 13V3M4 7l4-4 4 4"/></svg></button>
      </form>
    </section>

    <!-- VIEW -->
    <section class="pane pane-view" id="paneView" aria-label="檢視">
      <div class="pane-head">
        <h2><span class="en">VIEW</span><span class="zh">檢視</span></h2>
        <div class="head-actions"><span class="count" id="viewCount"></span></div>
      </div>
      <div class="view-controls">
        <div class="role" role="radiogroup" aria-label="選擇身分" id="roleGroup"></div>
        <div class="tpls" role="radiogroup" aria-label="檢視範本" id="tplGroup"></div>
        <p class="role-note" id="roleNote"></p>
      </div>
      <div class="view-scroll" id="viewScroll"><div class="view" id="view"></div></div>
    </section>
  </main>

  <footer class="footnote">此網站為 Pitcherest 的產品概念示範，其中所有專案、人名、品牌與資料皆為虛構的示範資料。</footer>

  <nav class="tabbar" id="tabbar" aria-label="主要分頁">
    <button data-go="archive" class="on"><svg class="ico" viewBox="0 0 20 20"><path d="M3.5 5.5h13M3.5 10h13M3.5 14.5h8"/></svg><span>資料庫</span></button>
    <button data-go="ask"><svg class="ico" viewBox="0 0 20 20"><path d="M4 4.5h12v8H9.5L6 16v-3.5H4z"/></svg><span>提問</span></button>
    <button data-go="view"><svg class="ico" viewBox="0 0 20 20"><rect x="3.5" y="3.5" width="5.5" height="7"/><rect x="11" y="3.5" width="5.5" height="4"/><rect x="11" y="9.5" width="5.5" height="7"/><rect x="3.5" y="12.5" width="5.5" height="4"/></svg><span>檢視</span><i class="badge" id="tabBadge" hidden></i></button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
